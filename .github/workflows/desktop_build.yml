name: Build Windows Desktop Package (波可桌面萌宠)

# ⚠️ 所有 action 都固定到 commit SHA，而不是会移动的 tag。
#    版本对照见 .github/dependabot.yml。

# 为什么需要这个工作流：
#   桌面端（PyQt6）的 EXE / 单文件安装包此前**完全没有 CI 覆盖** ——
#   打包脚本能不能跑通、spec 会不会被构建过程改写、打出来的产物是否完整，
#   全靠某个人在某台 Windows 机器上手工验证。
#   这个工作流把「桌面端能出包」变成一个可复现、可回归的闸门：
#   任何一次 push 到主分支都会真实跑一遍完整打包链路并把产物传上来。

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  desktop-package:
    name: Build DesktopPet.exe + 单文件安装包
    runs-on: windows-latest
    # 护栏: PyInstaller 打包整个 PyQt6 应用，正常约 3-6 分钟。
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PyQt6>=6.6" "Pillow>=10.0" "pyinstaller>=6.0"

      # ── 守护 1: .spec 必须是打包配置的唯一事实来源 ──
      # 以前 build_exe.py 走命令行参数，PyInstaller 会生成同名 spec
      # **覆盖掉仓库里那份手写的**，于是每次打包都把 git 工作区弄脏一次。
      # 现在改成直接用仓库内的 spec，但这条约定需要一个自动守护，
      # 否则将来有人把参数写法改回去，问题会再次悄悄出现。
      - name: Record spec hashes before build
        shell: pwsh
        run: |
          Get-FileHash DesktopPet.spec, DesktopPet_Setup.spec -Algorithm SHA256 |
            Select-Object @{Name='File';Expression={Split-Path $_.Path -Leaf}}, Hash |
            ConvertTo-Json | Out-File -FilePath spec-hashes-before.json -Encoding utf8
          Get-Content spec-hashes-before.json

      - name: Build Windows Executable
        run: python build_exe.py

      # --quick: 复用上一步刚编好的 dist/DesktopPet/，不重复编译一次核心程序。
      # （不带 --quick 时 build_installer.py 会自己再编一遍，等于白干两遍。）
      - name: Package single-file installer
        run: python build_installer.py --quick

      - name: Assert spec files were not rewritten by the build
        shell: pwsh
        run: |
          $before = Get-Content spec-hashes-before.json -Raw | ConvertFrom-Json
          $after = Get-FileHash DesktopPet.spec, DesktopPet_Setup.spec -Algorithm SHA256
          $changed = @()
          foreach ($h in $after) {
            $leaf = Split-Path $h.Path -Leaf
            $b = $before | Where-Object { $_.File -eq $leaf }
            if (-not $b -or $b.Hash -ne $h.Hash) { $changed += $leaf }
          }
          if ($changed.Count -gt 0) {
            Write-Error ("打包过程改写了仓库内的 .spec 文件: " + ($changed -join ', '))
            exit 1
          }
          Write-Host "OK: 两份 .spec 打包前后 sha256 完全一致"

      - name: Verify build outputs
        shell: pwsh
        run: |
          $expected = @(
            'dist/DesktopPet/DesktopPet.exe',
            'dist/DesktopPet_Setup.exe'
          )
          foreach ($p in $expected) {
            if (-not (Test-Path $p)) {
              Write-Error "缺少构建产物: $p"
              exit 1
            }
          }
          Write-Host "OK: 所有预期产物均已生成"

      # 上报桌面端产物体积。
      # ⚠️ 和 APK 一样：此前桌面端从不报体积，「安装包为什么这么大」
      # 「换个 Python 版本能省多少」这类问题在本地完全无法回答。
      - name: Report desktop artifact sizes
        shell: pwsh
        run: |
          $exe = (Get-Item 'dist/DesktopPet/DesktopPet.exe').Length
          $setup = (Get-Item 'dist/DesktopPet_Setup.exe').Length
          $zip = (Get-Item 'dist/payload.zip').Length
          function Fmt($b) { '{0:N2} MB ({1:N0} bytes)' -f ($b / 1MB), $b }
          Write-Host "DesktopPet.exe      : $(Fmt $exe)"
          Write-Host "DesktopPet_Setup.exe: $(Fmt $setup)"
          Write-Host "payload.zip         : $(Fmt $zip)"
          @"
          ### 🖥️ 桌面端产物体积

          | 文件 | 体积 |
          |---|---|
          | DesktopPet.exe | $(Fmt $exe) |
          | DesktopPet_Setup.exe | $(Fmt $setup) |
          | payload.zip | $(Fmt $zip) |
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Upload DesktopPet.exe bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Poko-DesktopPet-Windows-EXE
          path: dist/DesktopPet/
          retention-days: 14

      - name: Upload single-file installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Poko-DesktopPet-Windows-Setup
          path: dist/DesktopPet_Setup.exe
          retention-days: 14
