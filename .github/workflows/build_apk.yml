name: Build Android APK (波可桌面萌宠)

# ⚠️ 所有 action 都固定到 commit SHA，而不是会移动的 tag。
#    tag 指向的代码随时可能变（上游被入侵 / 账号失陷时最典型的手法就是推 tag），
#    钉 SHA 后只有 Dependabot 能改这里，改动会走 PR 评审。
#    版本对照见 .github/dependabot.yml。

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Poko Flutter APK
    runs-on: ubuntu-latest
    # 护栏: Gradle 卡死时不要无限期占用 CI 额度。正常构建约 10-15 分钟。
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # 缓存 Gradle 依赖与构建产物。
      # ⚠️ flutter-action 的 cache 只覆盖 Flutter SDK 和 pub cache，**不含** ~/.gradle，
      # 所以 Gradle 发行版(gradle-9.3.1-all.zip ≈ 224MB)+ AGP + 全部 AndroidX 依赖
      # 此前每次 push 都要重新下载一遍。这是当前 CI 最耗时的一段。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # ⚠️ 钉死 Flutter 版本：channel: stable 是浮动的，stable 一更新，
          #    构建结果就跟着变 —— 既不可复现，也可能在某天突然崩掉。
          #    本地开发用的是 3.47.2，这里保持一致。
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Check Flutter Version
        run: flutter --version

      - name: Get Dependencies
        run: |
          cd flutter_pet
          flutter pub get

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x flutter_pet/android/gradlew

      - name: Run Flutter Analyze
        run: |
          cd flutter_pet
          flutter analyze --no-fatal-infos

      - name: Run Flutter Tests
        run: |
          cd flutter_pet
          # 串行执行: 并行跑在高负载机器上会因资源竞争随机变红(基线代码同样会红), 串行保证结果可复现
          flutter test --concurrency=1

      # 第二道闸门: 扫描 Kotlin 的 JVM 签名冲突 (Platform declaration clash)。
      # 这类错误属于编译器 backend 阶段, 本地缺 android.jar 时根本走不到 backend,
      # 只能等 CI 炸出来 —— 所以在这里抢在 Gradle 编译之前用源码推导拦住。
      # 与 Dart 守护测试里的「Kotlin JVM 签名冲突」组是两套独立实现, 互为交叉验证。
      - name: Scan Kotlin JVM Signature Clashes
        run: |
          python3 tool/kotlin_jvm_clash_scan.py --self-test
          python3 tool/kotlin_jvm_clash_scan.py flutter_pet/android/app/src/main/kotlin

      - name: Build Release APK
        run: |
          cd flutter_pet
          flutter build apk --release --no-tree-shake-icons

      # 上报 APK 体积。
      # ⚠️ 此前 CI 只上传产物、从不报体积，导致「开 R8 能省多少」「拆包能省多少」
      # 这类问题在本地无法回答（打包在 CI 上做，本机没有 Android SDK）——
      # 体积数字必须出现在 CI 日志和 Job Summary 里，才谈得上做体积闸门。
      - name: Report APK Size
        run: |
          APK=flutter_pet/build/app/outputs/flutter-apk/app-release.apk
          SIZE=$(stat -c%s "$APK")
          MB=$(awk -v b="$SIZE" 'BEGIN{printf "%.2f", b/1048576}')
          echo "APK size: ${MB} MB (${SIZE} bytes)"
          {
            echo "### 📦 Android APK 体积"
            echo ""
            echo "| 文件 | 体积 |"
            echo "|---|---|"
            echo "| app-release.apk | ${MB} MB (${SIZE} bytes) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Poko-DesktopPet-Android-APK
          path: flutter_pet/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
