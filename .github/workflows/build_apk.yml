name: Build Android APK (波可桌面萌宠)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Poko Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter Version
        run: flutter --version

      - name: Get Dependencies
        run: |
          cd flutter_pet
          flutter pub get

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x flutter_pet/android/gradlew

      - name: Run Flutter Analyze
        run: |
          cd flutter_pet
          flutter analyze --no-fatal-infos

      - name: Run Flutter Tests
        run: |
          cd flutter_pet
          # 串行执行: 并行跑在高负载机器上会因资源竞争随机变红(基线代码同样会红), 串行保证结果可复现
          flutter test --concurrency=1

      # 第二道闸门: 扫描 Kotlin 的 JVM 签名冲突 (Platform declaration clash)。
      # 这类错误属于编译器 backend 阶段, 本地缺 android.jar 时根本走不到 backend,
      # 只能等 CI 炸出来 —— 所以在这里抢在 Gradle 编译之前用源码推导拦住。
      # 与 Dart 守护测试里的「Kotlin JVM 签名冲突」组是两套独立实现, 互为交叉验证。
      - name: Scan Kotlin JVM Signature Clashes
        run: |
          python3 tool/kotlin_jvm_clash_scan.py --self-test
          python3 tool/kotlin_jvm_clash_scan.py flutter_pet/android/app/src/main/kotlin

      - name: Build Release APK
        run: |
          cd flutter_pet
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Poko-DesktopPet-Android-APK
          path: flutter_pet/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
