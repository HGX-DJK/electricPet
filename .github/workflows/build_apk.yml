name: Build Android APK (波可桌面萌宠)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Poko Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter Version
        run: flutter --version

      - name: Get Dependencies
        run: |
          cd flutter_pet
          flutter pub get

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x flutter_pet/android/gradlew

      - name: Run Flutter Tests
        run: |
          cd flutter_pet
          flutter test

      - name: Build Release APK
        run: |
          cd flutter_pet
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Poko-DesktopPet-Android-APK
          path: flutter_pet/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
