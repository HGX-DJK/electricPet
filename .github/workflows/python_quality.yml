name: Python Quality Gate (桌面萌宠 · 波可)

# 桌面萌宠的 Python (PyQt6) 侧目前完全没有 CI —— 所有回归都靠人肉发现。
# 这个工作流补上三道闸门：
#   1) 纯逻辑单元测试（标准库 unittest，不需要 Qt，ubuntu 上秒级跑完）
#   2) 需要 Qt 的行为测试（对话框定时器收口、专注面板停表、便签字段兜底）
#      —— 在 Windows 上用 offscreen 平台真跑，不只是「import 得进去」
#   3) 全仓语法编译 + Qt 模块导入冒烟（抓「漏 import / 语法错」这类本地看不出来的问题）

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Python Unit Tests (纯逻辑, 无需 Qt)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Byte-compile every Python file (抓语法错)
        run: |
          python -m compileall -q pet tool tests main.py build_exe.py build_installer.py installer_gui.py installer

      - name: Run unit tests
        # pet/model.py + pet/audio.py + pet/system_monitor.py 全是标准库实现
        # （winsound 有 try/except 兜底），所以这里不需要装 PyQt6。
        run: python -m unittest discover -s tests -t . -v

  import-smoke:
    name: Qt 行为测试 + 模块导入冒烟 (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PyQt6>=6.6" "Pillow>=10.0"

      # 真正跑那 9 个需要 Qt 的测试（对话框定时器收口 / 专注面板停表 / 便签字段兜底）。
      # ⚠️ ubuntu 任务没装 PyQt6，这 9 个在那边是 skip 状态 —— 也就是说
      #    「对话框关闭后定时器有没有停」这类行为此前在 CI 上**从来没有被验证过**。
      #    offscreen 平台插件让 QWidget 可以在没有显示器的机器上正常创建。
      - name: Run full unit test suite with Qt (offscreen)
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          python -m unittest discover -s tests -t . -v

      - name: Import every Qt module (抓漏 import / 顶层崩溃)
        # 只 import，不创建 QApplication —— 无头环境下不需要显示器。
        run: |
          python -c "import pet.model, pet.audio, pet.system_monitor; print('core ok')"
          python -c "import pet.renderer; print('renderer ok')"
          python -c "import pet.dialogue; print('dialogue ok')"
          python -c "import pet.menus; print('menus ok')"
          python -c "import pet.dock; print('dock ok')"
          python -c "import pet.memo; print('memo ok')"
          python -c "import pet.tray; print('tray ok')"
          python -c "import pet.window; print('window ok')"
          python -c "import main; print('main ok')"
