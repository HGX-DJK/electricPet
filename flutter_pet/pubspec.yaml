name: flutter_pet
description: "Desktop & Mobile Electric Pet Poko - Flutter Cross-Platform Edition"
publish_to: "none"
version: 1.0.40+43

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  record: ^7.1.2
  sensors_plus: ^7.1.1
  shared_preferences: ^2.2.2
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/audio/
