name: flutter_pet
description: "Desktop & Mobile Electric Pet Poko - Flutter Cross-Platform Edition"
publish_to: "none"
version: 1.0.40+43

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  record: ^7.1.2
  sensors_plus: ^7.1.1
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  record_platform_interface: ^2.1.0
  # 写盘合并回归测试要数「模型到底往 SharedPreferences 写了几次」，
  # 而 legacy API 最终都落在 SharedPreferencesStorePlatform.setValue 上，
  # 所以直接用平台接口包一层计数（与 record_platform_interface 同一思路）。
  shared_preferences_platform_interface: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    # ⚠️ 不要把 assets/app_icon.png 加回来：全项目零引用，纯死重（166 KB），
    #    每个 APK 都白白背着它。桌面端图标走 assets/app.ico 那条线。
    - assets/audio/
